name: Secret Handling Demonstration

# The workflow_dispatch trigger in GitHub Actions allows users to manually start a workflow from the GitHub UI or via the API, giving them control over when the workflow runs.
# This feature is useful for tasks that should not run automatically, such as deployments or other manual processes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Consume secret safely
        env:
          MY_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          # The secret is available to this subshell via the MY_API_KEY variable - never print it to terminal IRL though
          echo "Connecting to mock service using secret..."
          python -c "import os; key=os.environ.get('MY_API_KEY'); print(f'Key length is {len(key)}')"