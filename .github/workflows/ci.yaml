#Fun fact - YAML never uses tabs for indentation - opposite of Python
#Human-readable title displayed in Github's Actions dashboard
name: Continuous Integration

#These are the event triggers - namely when I push and pull on main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

#These are my groups of individual execution blocks
jobs:
  validate-codebase:
    name: Lint, Test, and Verify
    #Github will provide a runner on this OS for me
    runs-on: ubuntu-latest

    #Especially helpful for me - if I push a bunch of commits in a short period of time, this will cancel the current workflow execution instead
    # of needlessly running the same thing multiple times for each minor change
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    #An ordered array of tests to be completed in order
      #List items begin with a hyphen, the followed by a space
    steps:
      - name: Demonstrate Context and Expression Usage
        run: |
          echo "Workflow triggered by user: ${{ github.actor }}"

      - name: Check out repository source code
        #This invokes an official GitHub action to clone my repo onto the runner
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        #Now it is executing these multiple shell commends at once
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run static linting analysis
        run: |
          # Stop execution if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce PEP 8 complexity and formatting rules
          flake8 src/ tests/ --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run automated test suite
        #It is executing the Python test framework pytest in verbose mode
        run: |
          python -m pytest -v --strict-markers

      - name: Run only if previous steps failed
        if: failure()
        run:
          echo "An upstream step failed; performing emergency cleanup."
