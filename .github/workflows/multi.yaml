name: Multi-Job Pipeline

#Triggers - the events which will cause this action to trigger
#on:
  #push:
    #branches: [ "main" ] #Ideally, should be triggered by changes on my production branch
  #pull_request:
    #branches: [ "main" ]

# These jobs run in order - if one fails, the rest don't get a chance to run
jobs:
  lint-codebase:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 src/ tests/

  # A matrix build lets you run a job across multiple operating systems, language runtimes, or configurations simultaneously without duplicating workflow files.
  matrix-test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # if true, when one matrix fails, all others stop as well; when false, they will all aim to run to completion
      matrix:
        os: [ubuntu-latest, windows-latest] #Here, I'm testing if the software runs on both Linux and Windows OSs
        python-version: ["3.10", "3.11", "3.12"] #I'm also testing to see if this works on multiple Python versions

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v